# Maladies cibles
diseases:
  - paludisme
  - cholera
  - rougeole
  - mpox
  - ebola
  - fievre jaune

# Paramètres temporels
temporal:
  start_year: 2021
  end_year: 2025
  frequency: "monthly"
  sequence_length: 12

# Paramètres spatiaux
spatial:
  grid_resolution: 500
  spatial_unit: "province"

# Chemins de données
paths:
  climate_raw: "data/climat/"
  sanitaires_raw: "data/sanitaires/"
  geospatial: "data/geospatial/"
  processed: "data/processed/"
  scraped: "data/scraped/"

# Gestion des valeurs manquantes
missing_values:
  strategy: "interpolate"
  max_missing_ratio: 0.3
